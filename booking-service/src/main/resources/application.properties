spring.application.name=booking-service
server.port=8082

# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3307/bookmyshow_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Qwerty@12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator configuration for health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost