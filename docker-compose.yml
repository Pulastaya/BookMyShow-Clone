version: '3.8'

services:
  # 1. MySQL database
  mysql:
    image: mysql:8.0
    container_name: bookmyshow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Qwerty@12
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pQwerty@12"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis temporary seat locker
  redis:
    image: redis:7.0-alpine
    container_name: bookmyshow-redis
    ports:
      - "6379:6379"
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: bookmyshow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Eureka Server for Service Discovery
  eureka-server:
    build: ./eureka-server
    container_name: bms-eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - bms-network

  # 5. Auth Service (User accounts & JWTs)
  auth-service:
    build: ./auth-service
    container_name: bms-auth-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bookmyshow_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Qwerty@12
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bms-network

  # 6. Movie Service (Catalog & showtimes)
  movie-service:
    build: ./movie-service
    container_name: bms-movie-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bookmyshow_movie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Qwerty@12
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bms-network

  # 7. Booking Service (Seat selector & locks)
  booking-service:
    build: ./booking-service
    container_name: bms-booking-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bookmyshow_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Qwerty@12
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bms-network

  # 8. Notification Service (Event-driven emails)
  notification-service:
    build: ./notification-service
    container_name: bms-notification-service
    ports:
      - "8084:8084"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bms-network

  # 9. API Gateway (Router & Global Auth)
  api-gateway:
    build: ./api-gateway
    container_name: bms-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - bms-network

  # 10. Frontend React Application
  frontend:
    build: ./frontend
    container_name: bms-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - bms-network

networks:
  bms-network:
    driver: bridge

volumes:
  mysql-data:
