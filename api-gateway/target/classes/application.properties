spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# =====================================
# AUTH SERVICE
# =====================================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# =====================================
# MOVIE SERVICE
# =====================================
spring.cloud.gateway.routes[1].id=movie-service
spring.cloud.gateway.routes[1].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/movies/**

# =====================================
# BOOKING SERVICE
# =====================================
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**

# =====================================
# SHOW SERVICE (routes to movie-service)
# =====================================
spring.cloud.gateway.routes[3].id=show-service
spring.cloud.gateway.routes[3].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/shows/**

# =====================================
# THEATER SERVICE (routes to movie-service)
# =====================================
spring.cloud.gateway.routes[4].id=theater-service
spring.cloud.gateway.routes[4].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/theaters/**

# =====================================
# THEATRE SERVICE (routes to movie-service)
# =====================================
spring.cloud.gateway.routes[5].id=theatre-service
spring.cloud.gateway.routes[5].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/theatres/**

# JWT
jwt.secret=9a4f2c8d3b7a1e5f8g2h6j9k1l4m7n0o3p6q9r2s5t8u1v4w7x0y3z2a5b8c1d4e7f0g3h6j9k1l4m7n0o3p6q9r2s5t8u1v4w7x0y3z2a5b8c1d4e7f0g

# CORS
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedHeaders=*

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost